name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: macos-14
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m playwright install chromium

      - name: Check installed dependencies
        run: python -m pip check

      - name: Lint Python
        run: python -m ruff check app tests

      - name: Check Python formatting
        run: python -m ruff format --check app tests

      - name: Check Python compilation
        run: python -m compileall -q app tests

      - name: Check launcher and JavaScript syntax
        run: |
          bash -n "Start App.command"
          node --check app/static/app.js

      - name: Run tests
        run: python -m pytest -q
